<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat - {{ name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
        }
        .chat-container {
            display: flex;
            flex: 1;
            height: 100vh;
        }
        .sidebar {
            background-color: #34495e;
            width: 250px;
            padding: 20px;
            overflow-y: auto;
        }
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background-color: #34495e;
            max-height: 75vh;
        }
        .message {
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            max-width: 70%;
            word-wrap: break-word;
            display: inline-block;
        }
        .message.sent {
            background-color: #1abc9c;
            align-self: flex-end;
        }
        .message.received {
            background-color: #16a085;
            align-self: flex-start;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background-color: #2c3e50;
            border-top: 1px solid #34495e;
        }
        #messageInput {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: none;
        }
        #sendButton {
            background-color: #1abc9c;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 10px;
        }
        #sendButton:hover {
            background-color: #16a085;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <h3>Online Users</h3>
            <ul id="userList" class="list-group"></ul>
        </div>
        <div class="main-chat">
            <div id="messages"></div>
            <div class="input-area">
                <input id="messageInput" class="form-control" placeholder="Type a message..." disabled>
                <button id="sendButton" class="btn" disabled>Send</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <script>
        const currentUser = '{{ name }}';
        const socket = io.connect(`http://${location.hostname}:5000`);

        let recipient = null;
        let socketsByName = {};
        let conversations = {};
        let unreadMessages = {};

        socket.on('connect', () => {
            socket.emit('register', {
                name: currentUser,
                publicKey: 'your-public-key-here'
            });
        });

        socket.on('users_updated', (users) => {
            socketsByName = {};
            users.forEach(user => {
                if (user !== currentUser) socketsByName[user] = true;
            });
            updateUserList(users);
        });

        function displayMessagesFor(user) {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';

            (conversations[user] || []).forEach(data => {
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', data.sender === currentUser ? 'sent' : 'received');
                messageDiv.textContent = data.plaintext;
                messagesDiv.appendChild(messageDiv);
            });

            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        socket.on('message', (data) => {
            const otherUser = data.sender === currentUser ? data.recipient : data.sender;
            if (!conversations[otherUser]) conversations[otherUser] = [];

            console.log("\nDecrypting Message:");
            console.log("Nonce:", data.nonce);
            console.log("Ciphertext:", data.ciphertext);
            const plaintext = atob(data.ciphertext); // Simulated decryption
            console.log("Plaintext:", plaintext, "\n");

            conversations[otherUser].push({
                sender: data.sender,
                plaintext: plaintext,
                ciphertext: data.ciphertext,
                nonce: data.nonce
            });

            if (!recipient) {
                startChat(otherUser); // Automatically start chat if none selected
            }

            if (recipient !== otherUser && data.sender !== currentUser) {
                unreadMessages[otherUser] = true;
                updateUserList(Object.keys(socketsByName));
            }

            if (recipient === otherUser) {
                displayMessagesFor(otherUser);
            }
        });

        function updateUserList(users) {
            const userList = document.getElementById('userList');
            userList.innerHTML = '';
            users.forEach(user => {
                if (user !== currentUser) {
                    const li = document.createElement('li');
                    li.classList.add('list-group-item', 'd-flex', 'justify-content-between', 'align-items-center');
                    li.style.cursor = 'pointer';
                    li.textContent = user;

                    if (unreadMessages[user]) {
                        const badge = document.createElement('span');
                        badge.classList.add('badge', 'bg-danger', 'rounded-pill');
                        badge.textContent = '!';
                        li.appendChild(badge);
                    }

                    li.onclick = () => startChat(user);
                    userList.appendChild(li);
                }
            });
        }

        function startChat(user) {
            recipient = user;
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
            document.getElementById('messageInput').placeholder = `Type a message to ${user}`;
            unreadMessages[user] = false;
            updateUserList(Object.keys(socketsByName));
            displayMessagesFor(user);
        }

        document.getElementById('sendButton').onclick = () => {
            const message = document.getElementById('messageInput').value;
            if (recipient && message.trim() !== '') {
                const nonce = window.crypto.getRandomValues(new Uint8Array(12));
                const nonceHex = Array.from(nonce).map(b => b.toString(16).padStart(2, '0')).join('');
                const ciphertext = btoa(message); // Simulated encryption

                console.log("\nEncrypting Message:");
                console.log("Plaintext:", message);
                console.log("Nonce:", nonceHex);
                console.log("Ciphertext:", ciphertext);
                console.log("Final Encrypted Data:", nonceHex + "|" + ciphertext, "\n");

                socket.emit('send_message', {
                    ciphertext: ciphertext,
                    recipient: recipient,
                    nonce: nonceHex,
                    plaintext: message, // optional
                    log: {
                        plaintext: message,
                        nonce: nonceHex,
                        ciphertext: ciphertext,
                        finalData: nonceHex + "|" + ciphertext
                    }
                });

                if (!conversations[recipient]) conversations[recipient] = [];
                conversations[recipient].push({
                    sender: currentUser,
                    plaintext: message
                });

                displayMessagesFor(recipient);
                document.getElementById('messageInput').value = '';
            }
        };
    </script>
</body>
</html>
