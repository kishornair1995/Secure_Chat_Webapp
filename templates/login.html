<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat Login</title>
    <!-- Add Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background-color: #34495e;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-control {
            background-color: #2c3e50;
            border: 1px solid #1abc9c;
            color: white;
        }

        .btn-custom {
            background-color: #1abc9c;
            color: white;
        }

        .btn-custom:hover {
            background-color: #16a085;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Connect to Secure Chat</h2>
        <form method="POST">
            <div class="mb-3">
                <input type="text" name="server_ip" class="form-control" placeholder="Server IP" required>
            </div>
            <div class="mb-3">
                <input type="number" name="server_port" class="form-control" placeholder="Port" required>
            </div>
            <div class="mb-3">
                <input type="text" name="name" class="form-control" placeholder="Your Name" required>
            </div>
            <button type="submit" class="btn btn-custom w-100">Connect</button>
        </form>
    </div>

    <!-- Add Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
